<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <style>
      .box { fill: #f7fafc; stroke: #29527a; stroke-width: 2; rx: 14; }
      .accent { fill: #e5f3ff; stroke: #1677b8; stroke-width: 2; rx: 14; }
      .text { font: 18px Arial, sans-serif; fill: #17324d; text-anchor: middle; }
      .small { font: 14px Arial, sans-serif; fill: #36566f; text-anchor: middle; }
      .arrow { stroke: #456b88; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#456b88"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="600" y="42" class="text" style="font-size:26px;font-weight:bold">Heart Disease MLOps Architecture</text>
  <rect x="40" y="110" width="180" height="100" class="box"/>
  <text x="130" y="150" class="text">UCI Dataset</text>
  <text x="130" y="178" class="small">download + validation</text>
  <rect x="285" y="110" width="200" height="100" class="box"/>
  <text x="385" y="145" class="text">EDA + Features</text>
  <text x="385" y="174" class="small">impute, encode, scale</text>
  <rect x="550" y="90" width="210" height="140" class="accent"/>
  <text x="655" y="135" class="text">Training</text>
  <text x="655" y="164" class="small">Logistic + Random Forest</text>
  <text x="655" y="190" class="small">CV + holdout evaluation</text>
  <rect x="825" y="110" width="160" height="100" class="box"/>
  <text x="905" y="150" class="text">MLflow</text>
  <text x="905" y="178" class="small">runs + artifacts</text>
  <rect x="550" y="320" width="210" height="110" class="accent"/>
  <text x="655" y="360" class="text">FastAPI + Model</text>
  <text x="655" y="389" class="small">Docker image</text>
  <rect x="285" y="325" width="200" height="100" class="box"/>
  <text x="385" y="365" class="text">GitHub Actions</text>
  <text x="385" y="393" class="small">lint, test, train, build</text>
  <rect x="825" y="320" width="160" height="110" class="box"/>
  <text x="905" y="360" class="text">Kubernetes</text>
  <text x="905" y="389" class="small">Ingress + HPA</text>
  <rect x="1025" y="320" width="150" height="110" class="box"/>
  <text x="1100" y="354" class="text">Monitoring</text>
  <text x="1100" y="383" class="small">Prometheus</text>
  <text x="1100" y="405" class="small">Grafana + logs</text>
  <path d="M220 160 L285 160" class="arrow"/>
  <path d="M485 160 L550 160" class="arrow"/>
  <path d="M760 160 L825 160" class="arrow"/>
  <path d="M655 230 L655 320" class="arrow"/>
  <path d="M485 375 L550 375" class="arrow"/>
  <path d="M760 375 L825 375" class="arrow"/>
  <path d="M985 375 L1025 375" class="arrow"/>
  <path d="M385 325 L385 245 L655 245 L655 230" class="arrow"/>
</svg>

